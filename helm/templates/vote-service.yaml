apiVersion: v1
kind: Service
metadata:
  name: vote
  labels:
    app: vote
spec:
  type: {{ .Values.services.vote.type }}
  ports:
    - name: vote-service
      port: {{ .Values.services.vote.port }}
      targetPort: {{ .Values.services.vote.targetPort }}
      nodePort: {{ .Values.services.vote.nodePort }}
  selector:
    app: vote
