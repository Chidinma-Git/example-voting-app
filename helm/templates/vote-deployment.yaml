apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  labels:
    app: vote
spec:
  replicas: {{ .Values.replicaCount.vote }}
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
        - name: vote
          image: "{{ .Values.images.vote.repository }}:{{ .Values.images.vote.tag }}"
          imagePullPolicy: {{ .Values.images.vote.pullPolicy }}
          ports:
            - name: vote
              containerPort: 80
